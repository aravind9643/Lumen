<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Lumen · Learn it properly.</title>
    <meta
      name="description"
      content="In-depth, carefully written tutorials that start from zero and build up. Free, open, and made for people who want to actually understand the subject."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Flat mark: solid indigo tile with a white "L". No emoji, no gradient. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='72' font-size='62' font-family='system-ui,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E"
    />

    <script>
      // Apply the stored theme before first paint so there is no flash of the
      // wrong colour scheme on reload.
      (function () {
        try {
          var mode = JSON.parse(localStorage.getItem('theme:mode') || '"system"');
          var accent = JSON.parse(localStorage.getItem('theme:accent') || '"indigo"');
          var scale = JSON.parse(localStorage.getItem('theme:font-scale') || '1');
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.accent = accent;
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.documentElement.style.setProperty('--font-scale', String(scale));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
