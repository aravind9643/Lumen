name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Guards + typecheck + lint + unit tests. Each catches a failure that is
      # otherwise silent. `build` also runs verify, prerender, and the bundle
      # budget check.
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Runs against the built output — prerendering and hydration only exist
      # after a production build.
      - run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
